<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twibbon Maker - 4rD Design</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .checkerboard {
            background-color: #f8fafc;
            background-image: linear-gradient(45deg, #cbd5e1 25%, transparent 25%), 
                              linear-gradient(-45deg, #cbd5e1 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #cbd5e1 75%), 
                              linear-gradient(-45deg, transparent 75%, #cbd5e1 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Header / Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-extrabold text-xl text-white shadow-lg shadow-blue-500/30">
                    4rD
                </div>
                <div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-white via-slate-200 to-blue-400 bg-clip-text text-transparent">
                        4rD Design
                    </h1>
                    <p class="text-xs text-slate-400">Generator Twibbon Instan</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-blue-500/10 text-blue-400 border border-blue-500/20">
                    <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                    Versi HD
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left Panel: Canvas Studio -->
        <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-800/50 p-4 md:p-6 rounded-2xl border border-slate-700/50 shadow-xl">
            <!-- Canvas Container -->
            <div class="relative w-full max-w-[450px] aspect-square rounded-2xl overflow-hidden shadow-2xl checkerboard border-2 border-slate-700 group flex items-center justify-center">
                
                <!-- Canvas Element -->
                <canvas id="twibbonCanvas" class="w-full h-full cursor-grab active:cursor-grabbing touch-none select-none relative z-10"></canvas>
                
                <!-- Helper Overlay when no image uploaded -->
                <div id="uploadPrompt" class="absolute inset-0 z-20 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm p-6 text-center transition-all duration-300">
                    <div class="w-16 h-16 rounded-full bg-blue-500/10 text-blue-400 flex items-center justify-center mb-4 text-2xl border border-blue-500/20">
                        <i class="fa-solid md:fa-cloud-arrow-up"></i>
                    </div>
                    <h3 class="text-lg font-semibold text-white mb-1">Unggah Foto Kamu</h3>
                    <p class="text-xs text-slate-400 mb-5 max-w-xs">Pilih foto dari perangkatmu untuk dimasukkan ke dalam twibbon.</p>
                    <button onclick="document.getElementById('imageInput').click()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-medium text-sm rounded-xl shadow-lg shadow-blue-600/30 transition-all flex items-center gap-2">
                        <i class="fa-solid fa-image"></i> Pilih Foto
                    </button>
                </div>
            </div>

            <!-- Touch / Drag Tip -->
            <p class="text-xs text-slate-400 mt-4 flex items-center gap-1.5 text-center">
                <i class="fa-solid fa-hand-pointer text-blue-400"></i>
                <span>Geser & sesuaikan posisi foto langsung pada gambar di atas</span>
            </p>
        </section>

        <!-- Right Panel: Controls & Options -->
        <section class="lg:col-span-5 space-y-6">
            
            <!-- Step 1: Select Frame -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 shadow-lg">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <span class="w-5 h-5 rounded-full bg-blue-500 text-white text-xs flex items-center justify-center">1</span>
                    Pilih Frame Twibbon
                </h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <!-- Frame 1 Option -->
                    <button id="btnFrame1" onclick="selectFrame(1)" class="frame-card group relative rounded-xl border-2 border-blue-500 bg-slate-900/60 p-2 text-left transition-all overflow-hidden focus:outline-none">
                        <div class="aspect-square rounded-lg overflow-hidden bg-slate-800 mb-2 relative">
                            <img src="https://drive.google.com/uc?id=1ftUfiVaB4AHUAEh4vGmzKrqRqx0h1rpa" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/400x400/1e293b/3b82f6?text=Frame+1';" 
                                 alt="Frame 1" 
                                 class="w-full h-full object-cover">
                        </div>
                        <div class="flex items-center justify-between px-1">
                            <span class="text-xs font-semibold text-white">Frame 1</span>
                            <i id="checkFrame1" class="fa-solid fa-circle-check text-blue-500 text-sm"></i>
                        </div>
                    </button>

                    <!-- Frame 2 Option -->
                    <button id="btnFrame2" onclick="selectFrame(2)" class="frame-card group relative rounded-xl border-2 border-slate-700 bg-slate-900/60 p-2 text-left transition-all overflow-hidden focus:outline-none hover:border-slate-500">
                        <div class="aspect-square rounded-lg overflow-hidden bg-slate-800 mb-2 relative">
                            <img src="https://drive.google.com/uc?id=1j8qMaNUXEfn7itshD98VEzbT5lh8pDZ6u" 
                                 onerror="this.onerror=null; this.src='https://placehold.co/400x400/1e293b/3b82f6?text=Frame+2';" 
                                 alt="Frame 2" 
                                 class="w-full h-full object-cover">
                        </div>
                        <div class="flex items-center justify-between px-1">
                            <span class="text-xs font-semibold text-slate-300">Frame 2</span>
                            <i id="checkFrame2" class="fa-solid fa-circle-check text-slate-600 text-sm hidden"></i>
                        </div>
                    </button>
                </div>
            </div>

            <!-- Step 2: Image Adjustments -->
            <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 shadow-lg space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <span class="w-5 h-5 rounded-full bg-blue-500 text-white text-xs flex items-center justify-center">2</span>
                        Pengaturan Foto
                    </h2>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                    <button onclick="document.getElementById('imageInput').click()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition">
                        Ganti Foto
                    </button>
                </div>

                <!-- Zoom Slider -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs text-slate-300 font-medium">
                        <label for="zoomSlider"><i class="fa-solid fa-magnifying-glass mr-1"></i> Ukuran (Zoom)</label>
                        <span id="zoomVal">100%</span>
                    </div>
                    <input type="range" id="zoomSlider" min="0.1" max="3" step="0.01" value="1" disabled 
                           class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 disabled:opacity-40"
                           oninput="updateImageTransform()">
                </div>

                <!-- Rotate Slider -->
                <div class="space-y-1.5">
                    <div class="flex justify-between text-xs text-slate-300 font-medium">
                        <label for="rotateSlider"><i class="fa-solid fa-rotate mr-1"></i> Rotasi</label>
                        <span id="rotateVal">0°</span>
                    </div>
                    <input type="range" id="rotateSlider" min="-180" max="180" step="1" value="0" disabled 
                           class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 disabled:opacity-40"
                           oninput="updateImageTransform()">
                </div>

                <!-- Quick Actions -->
                <div class="pt-2 flex items-center gap-2">
                    <button onclick="resetTransform()" id="btnReset" disabled class="flex-1 py-2 px-3 bg-slate-700/50 hover:bg-slate-700 text-xs font-medium text-slate-300 rounded-lg transition flex items-center justify-center gap-1.5 disabled:opacity-40">
                        <i class="fa-solid fa-arrow-rotate-left"></i> Reset Posisi
                    </button>
                </div>
            </div>

            <!-- Step 3: Download -->
            <div class="pt-2">
                <button id="btnDownload" onclick="downloadTwibbon()" disabled 
                        class="w-full py-3.5 px-6 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 disabled:from-slate-800 disabled:to-slate-800 text-white font-semibold text-base rounded-xl shadow-lg shadow-blue-600/25 disabled:shadow-none transition-all flex items-center justify-center gap-2 disabled:text-slate-500 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-download"></i> Download Twibbon HD
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-800 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 <span class="font-bold text-slate-400">4rD Design</span>. Seluruh Hak Cipta Dilindungi.</p>
    </footer>

    <script>
        // Frame URLs
        const frames = {
            1: "https://drive.google.com/uc?id=1ftUfiVaB4AHUAEh4vGmzKrqRqx0h1rpa",
            2: "https://drive.google.com/uc?id=1j8qMaNUXEfn7itshD98VEzbT5lh8pDZ6u"
        };

        // State Variables
        let currentFrameId = 1;
        let canvas = document.getElementById('twibbonCanvas');
        let ctx = canvas.getContext('2d');
        
        let frameImg = new Image();
        let userImg = null;

        // Image Transformation State
        let transform = {
            x: 0,
            y: 0,
            scale: 1,
            rotate: 0
        };

        // Interaction State
        let isDragging = false;
        let startCoords = { x: 0, y: 0 };

        // Canvas resolution size (High Quality Output)
        const CANVAS_SIZE = 1080;

        window.onload = function() {
            // Set canvas size
            canvas.width = CANVAS_SIZE;
            canvas.height = CANVAS_SIZE;

            // Load initial frame
            loadFrame(frames[currentFrameId]);

            // Add Canvas Mouse & Touch Event Listeners
            setupCanvasInteraction();
        };

        function loadFrame(src) {
            frameImg = new Image();
            frameImg.crossOrigin = "anonymous";
            frameImg.onload = function() {
                render();
            };
            frameImg.onerror = function() {
                // Fallback using placehold if Google Drive CORS or link fails
                frameImg.src = `https://placehold.co/1080x1080/1e293b/3b82f6?text=Frame+${currentFrameId}+4rD+Design`;
            };
            frameImg.src = src;
        }

        function selectFrame(id) {
            currentFrameId = id;

            // Update UI card borders
            const b1 = document.getElementById('btnFrame1');
            const b2 = document.getElementById('btnFrame2');
            const c1 = document.getElementById('checkFrame1');
            const c2 = document.getElementById('checkFrame2');

            if (id === 1) {
                b1.className = "frame-card group relative rounded-xl border-2 border-blue-500 bg-slate-900/60 p-2 text-left transition-all overflow-hidden focus:outline-none";
                b2.className = "frame-card group relative rounded-xl border-2 border-slate-700 bg-slate-900/60 p-2 text-left transition-all overflow-hidden focus:outline-none hover:border-slate-500";
                c1.classList.remove('hidden');
                c2.classList.add('hidden');
            } else {
                b2.className = "frame-card group relative rounded-xl border-2 border-blue-500 bg-slate-900/60 p-2 text-left transition-all overflow-hidden focus:outline-none";
                b1.className = "frame-card group relative rounded-xl border-2 border-slate-700 bg-slate-900/60 p-2 text-left transition-all overflow-hidden focus:outline-none hover:border-slate-500";
                c2.classList.remove('hidden');
                c1.classList.add('hidden');
            }

            loadFrame(frames[id]);
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                userImg = new Image();
                userImg.onload = function() {
                    // Hide prompt overlay
                    document.getElementById('uploadPrompt').classList.add('hidden');
                    
                    // Enable sliders and buttons
                    document.getElementById('zoomSlider').disabled = false;
                    document.getElementById('rotateSlider').disabled = false;
                    document.getElementById('btnReset').disabled = false;
                    document.getElementById('btnDownload').disabled = false;

                    // Initial auto-fit
                    resetTransform();
                };
                userImg.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Reset transform settings
        function resetTransform() {
            if (!userImg) return;

            // Auto fit cover scale calculation
            const scaleX = CANVAS_SIZE / userImg.width;
            const scaleY = CANVAS_SIZE / userImg.height;
            const initialScale = Math.max(scaleX, scaleY);

            transform = {
                x: CANVAS_SIZE / 2,
                y: CANVAS_SIZE / 2,
                scale: initialScale,
                rotate: 0
            };

            document.getElementById('zoomSlider').value = initialScale.toFixed(2);
            document.getElementById('zoomVal').innerText = Math.round(initialScale * 100) + "%";
            document.getElementById('rotateSlider').value = 0;
            document.getElementById('rotateVal').innerText = "0°";

            render();
        }

        function updateImageTransform() {
            if (!userImg) return;

            const zoomVal = parseFloat(document.getElementById('zoomSlider').value);
            const rotateVal = parseInt(document.getElementById('rotateSlider').value);

            transform.scale = zoomVal;
            transform.rotate = rotateVal;

            document.getElementById('zoomVal').innerText = Math.round(zoomVal * 100) + "%";
            document.getElementById('rotateVal').innerText = rotateVal + "°";

            render();
        }

        function render() {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Draw User Image (Behind frame)
            if (userImg) {
                ctx.save();
                ctx.translate(transform.x, transform.y);
                ctx.rotate((transform.rotate * Math.PI) / 180);
                ctx.scale(transform.scale, transform.scale);
                ctx.drawImage(
                    userImg, 
                    -userImg.width / 2, 
                    -userImg.height / 2
                );
                ctx.restore();
            }

            // 2. Draw Frame Overlay (On top)
            if (frameImg.complete && frameImg.naturalWidth !== 0) {
                ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
            }
        }

        function setupCanvasInteraction() {
            const getPointerPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                // Scale click position to canvas actual size
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;

                return {
                    x: (clientX - rect.left) * scaleX,
                    y: (clientY - rect.top) * scaleY
                };
            };

            const startDrag = (e) => {
                if (!userImg) return;
                isDragging = true;
                const pos = getPointerPos(e);
                startCoords = {
                    x: pos.x - transform.x,
                    y: pos.y - transform.y
                };
            };

            const doDrag = (e) => {
                if (!isDragging || !userImg) return;
                e.preventDefault();
                const pos = getPointerPos(e);
                transform.x = pos.x - startCoords.x;
                transform.y = pos.y - startCoords.y;
                render();
            };

            const stopDrag = () => {
                isDragging = false;
            };

            // Mouse Events
            canvas.addEventListener('mousedown', startDrag);
            window.addEventListener('mousemove', doDrag);
            window.addEventListener('mouseup', stopDrag);

            // Touch Events for Mobile
            canvas.addEventListener('touchstart', startDrag);
            window.addEventListener('touchmove', doDrag, { passive: false });
            window.addEventListener('touchend', stopDrag);
        }

        function downloadTwibbon() {
            if (!userImg) return;

            // Generate image data URL
            const dataURL = canvas.toDataURL('image/png');
            
            // Create temporary link element for downloading
            const link = document.createElement('a');
            link.download = `Twibbon-4rD-Design-${Date.now()}.png`;
            link.href = dataURL;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
